[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiboard"
version = "0.1.0"
description = "Python SDK for AIBoard, the Avalon game server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
aiboard = "aiboard.cli:main"

[tool.setuptools.packages.find]
include = ["aiboard*"]
